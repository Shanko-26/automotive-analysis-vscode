version: '3.8'

services:
  automotive-backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Mount user's workspace for file access
      - ${WORKSPACE_PATH:-./sampledata}:/data:ro
    environment:
      - PYTHONPATH=/app
      - DATA_PATH=/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s 